<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>item · leon's shit tracker</title>
<style>
  body { background:#111; color:#ddd; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         margin:0 auto; max-width:760px; padding:24px 16px; line-height:1.55; }
  a { color:#8ab4f8; text-decoration:none; }
  a:hover { text-decoration:underline; }
  h1 { font-size:1.5em; margin:8px 0 4px; }
  h2 { font-size:1.1em; margin:22px 0 8px; border-bottom:1px solid #2a2a2a; padding-bottom:4px; }
  table { border-collapse:collapse; font-size:0.9em; width:100%; margin:8px 0; }
  th, td { border:1px solid #2a2a2a; padding:5px 8px; text-align:left; }
  th { opacity:0.6; font-size:0.85em; }
  code { background:#222; border-radius:3px; padding:0 4px; }
  em { color:#999; }
  ul { padding-left:1.3em; }
  li:has(> input[type=checkbox]) { list-style:none; margin-left:-1.3em; }
  input[type=checkbox] { accent-color:#6fcf97; margin-right:6px; }
  .top { display:flex; justify-content:space-between; align-items:center; font-size:0.85em; }
  .pills { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 4px; }
  .pill { border-radius:4px; padding:1px 8px; font-size:0.8em; border:1px solid; white-space:nowrap; }
  .meta { font-size:0.85em; opacity:0.85; margin:2px 0 14px; }
  .meta .rec { border-left:2px solid #bb86fc; padding-left:6px; color:#d9c2ff; }
</style>
</head>
<body>
<div class="top">
  <a href="index.html">← back to tracker</a>
  <a id="edit" href="#" target="_blank" rel="noopener">✏️ edit on GitHub</a>
</div>
<div id="head"></div>
<div id="content" style="opacity:0.5">loading…</div>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
const REPO_EDIT = "https://github.com/dgokcin/leon-tracker/edit/main/items/";
const esc = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

const STATUS = {
  todo:        ["⏳ To Do",       "#9b9bcf", "#1a1a2e", "#2a2a4a"],
  researching: ["🔍 Researching", "#bb86fc", "#1a1a3a", "#3a3a6a"],
  decided:     ["✔️ Decided",     "#56cfe1", "#0d1a2e", "#1a3a5a"],
  bought:      ["📦 Bought",      "#f2994a", "#3a2a10", "#6b4a1a"],
  done:        ["✅ Done",        "#6fcf97", "#1a3a1a", "#2d5a2d"],
  dropped:     ["🚫 Dropped",     "#888888", "#1a1a1a", "#333333"],
};
const PRIO = {
  high:   ["High prio",   "#ff6b6b", "#3a1414", "#6b2a2a"],
  medium: ["Medium prio", "#f2994a", "#3a2a10", "#6b4a1a"],
  low:    ["Low prio",    "#9b9bcf", "#1a1a2e", "#2a2a4a"],
};
const pill = ([label, fg, bg, bdr]) =>
  `<span class="pill" style="color:${fg};background:${bg};border-color:${bdr}">${label}</span>`;

const file = new URLSearchParams(location.search).get("f");
if (!file || !/^[\w.-]+\.md$/.test(file)) {
  document.getElementById("content").textContent = "bad or missing ?f= item file";
} else {
  document.getElementById("edit").href = REPO_EDIT + encodeURIComponent(file);
  Promise.all([
    fetch("items/" + encodeURIComponent(file)).then((r) => { if (!r.ok) throw r.status; return r.text(); }),
    fetch("items.json").then((r) => r.json()),
  ]).then(([src, items]) => {
    const it = items.find((x) => x.file === file) ?? {};
    document.title = `${it.title ?? file} · leon's shit tracker`;
    const body = src.replace(/^---\n[\s\S]*?\n---/, "").replace(/^\s*#\s+.*$/m, "");
    document.getElementById("head").innerHTML = `
      <h1>${it.kind === "do" ? "🛠️" : "🛒"} ${esc(it.title ?? file)}</h1>
      <div class="pills">
        ${pill(STATUS[it.status] ?? STATUS.todo)}
        ${pill(PRIO[it.priority] ?? PRIO.low)}
        ${it.category ? `<span class="pill" style="color:#9b9bcf;background:#1a1a2e;border-color:#2a2a4a">${esc(it.category)}</span>` : ""}
        ${it.budget ? `<span class="pill" style="color:#6fcf97;background:#1a3a1a;border-color:#2d5a2d">€${esc(it.budget)}</span>` : ""}
      </div>
      <div class="meta">
        ${it.deniz_rec ? `<div class="rec">Deniz: ${marked.parseInline(it.deniz_rec)}</div>` : ""}
        ${it.picked ? `<div>Picked: ${marked.parseInline(it.picked)}</div>` : ""}
        ${it.notes ? `<div style="opacity:0.6">${marked.parseInline(it.notes)}</div>` : ""}
      </div>`;
    const el = document.getElementById("content");
    el.style.opacity = 1;
    el.innerHTML = marked.parse(body, { gfm: true, breaks: true });
  }).catch((e) => {
    document.getElementById("content").textContent = `failed to load ${file}: ${e}`;
  });
}
</script>
</body>
</html>
